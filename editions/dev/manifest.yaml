# EchOS Dev Edition manifest
# Minimal desktop + full keyboard shortcuts + IDE toolchain.
# Built for developers (and the lab's own automated driving of the shell).

name: "EchOS Dev"
edition: dev
version: 1.0.0
kernel_flags: ["-DECHOS_EDITION_DEV=1"]

desktop:
  shell: eclipse-shell
  theme: eclipse-dark

shortcuts: full          # t/e/b/v/i/k/d/y/a/s/n/f/m/q, Alt+Tab, workspaces 1-3
ai:
  enabled: false          # Echo AI remains Complete-only
ide: true

packages:
  channel: core
