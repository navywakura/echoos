# GRUB config for a hard-disk install of rxOS45 (no CD/USB).
# root is the FAT partition that holds /boot/rxos.elf.
insmod all_video
insmod gfxterm
set timeout=3
set default=0

# Find the partition that has the kernel (works even if disk order shifts).
search --no-floppy --set=root --file /boot/rxos.elf

menuentry "rxOS45 - Rogex Laboratories (disk install)" {
    multiboot2 /boot/rxos.elf
    set gfxpayload=1366x768x32,1360x768x32,1280x768x32,1280x720x32,1280x800x32,1024x768x32,800x600x32
    boot
}

menuentry "RXos - safe graphics (1024x768)" {
    multiboot2 /boot/rxos.elf
    set gfxpayload=1024x768x32,800x600x32
    boot
}

menuentry "RXos - text console only (no framebuffer)" {
    multiboot2 /boot/rxos.elf
    set gfxpayload=text
    boot
}
