# EchOS — QEMU / VirtualBox. Version/edition injected by the Makefile at
# ISO staging time (@VER@ / @EDITION@). Eclipse wallpaper + dark menu.
insmod all_video
insmod gfxterm
insmod jpeg
insmod png
insmod font
set gfxmode=1280x720x32,1024x768x32,800x600x32,auto
set gfxpayload=keep
terminal_output gfxterm
if [ -f /boot/grub/eclipse.jpg ]; then
    background_image /boot/grub/eclipse.jpg
fi
set color_normal=light-gray/black
set color_highlight=black/white
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
set timeout=8
set default=3

menuentry "EchOS @VER@ @EDITION@ Installer / LIVE" {
    multiboot2 /boot/rxos.elf echos.mode=live
    module2 /boot/rxos.bin
    set gfxpayload=1280x720x32,1024x768x32,800x600x32
    boot
}

menuentry "EchOS Memory Test (Diagnostico de RAM)" {
    multiboot2 /boot/rxos.elf echos.mode=memtest
    module2 /boot/rxos.bin
    set gfxpayload=text
    boot
}

menuentry "EchOS Recovery Mode (Modo Recuperacion)" {
    multiboot2 /boot/rxos.elf echos.mode=recovery
    module2 /boot/rxos.bin
    set gfxpayload=text
    boot
}

menuentry "EchOS @VER@ @EDITION@ (VM)" {
    multiboot2 /boot/rxos.elf
    module2 /boot/rxos.bin
    set gfxpayload=1280x720x32,1024x768x32,800x600x32
    boot
}

menuentry "EchOS @VER@ @EDITION@ - safe graphics (1024x768)" {
    multiboot2 /boot/rxos.elf
    module2 /boot/rxos.bin
    set gfxpayload=1024x768x32,800x600x32
    boot
}

menuentry "EchOS @VER@ @EDITION@ - text console only" {
    multiboot2 /boot/rxos.elf
    module2 /boot/rxos.bin
    set gfxpayload=text
    boot
}
